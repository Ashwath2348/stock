<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockQ</title>

  <!-- GLOBAL CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    @keyframes cardFadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 1rem 1.5rem;
      background-color: #f8fafc;
      border-radius: 14px;
      margin-bottom: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .refresh-btn {
      padding: 8px 18px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.25s;
      min-height: 44px;
    }

    .refresh-btn:hover {
      background: #1e40af;
      transform: translateY(-1px);
    }

    /* ===== DESKTOP (UNCHANGED) ===== */
    .main {
      margin-left: 270px;  /* matches sidebar width */
      padding: 1.5rem;
    }

    /* ===== MOBILE FIX ===== */
    @media (max-width: 768px) {

      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(circle at 15% 8%, #eef4ff 0%, rgba(238, 244, 255, 0) 32%),
          radial-gradient(circle at 86% 2%, #e9f7ff 0%, rgba(233, 247, 255, 0) 30%),
          #d9dee7;
      }

      .main {
        order: 1;
      }

      .sidebar {
        order: 2;
      }

      .main {
        margin-left: 0;
        padding: 0.95rem 0.85rem 0.6rem;
        background: #d9dee7;
      }

      .header {
        align-items: center;
        gap: 10px;
        padding: 0.2rem 0;
        background: transparent;
        border: none;
        box-shadow: none;
        border-radius: 0;
      }

      .header-left {
        width: auto;
        margin-right: auto;
      }

      .header h1 {
        font-size: 1.8rem;
        line-height: 1;
        color: #111827;
      }

      .header-actions {
        width: auto;
        display: flex;
        flex-direction: row;
        gap: 8px;
      }

      .refresh-btn {
        width: auto;
        min-width: 92px;
        min-height: 36px;
        font-size: 0.92rem;
        border: none;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        background: linear-gradient(135deg, #2563eb, #1e40af);
      }

      .main > header {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        margin: 0.2rem 0.1rem 0;
        padding: 1rem 1rem 0.95rem;
        border-radius: 16px;
        background: #e6e9ef;
        border: 1px solid #d7dce4;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      }

      .timestamp {
        width: auto;
        margin-left: auto;
        background: #d7dce4;
        color: #6b7280;
        font-weight: 700;
        border-radius: 12px;
        padding: 0.45rem 0.65rem;
        font-size: 0.9rem;
      }

      .index-ticker-wrapper {
        margin: 0.7rem 0.1rem;
      }

      .main .index-ticker {
        width: 100%;
        gap: 18px;
        padding: 0.95rem 0.9rem;
        border-radius: 14px;
        background: #e8ebf2;
        border: 1px solid #d7dce4;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      }

      .main .index-item {
        font-size: 0.9rem;
        gap: 4px;
      }

      .container {
        padding: 0.35rem 0.1rem;
      }

      .main .container {
        padding: 0.45rem 0.2rem !important;
      }

      .main h2 {
        margin-top: 1.1rem;
        margin-bottom: 0.65rem;
        font-size: 1.72rem;
        line-height: 1;
        letter-spacing: -0.01em;
      }

      .main .stock-grid {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 0.75rem !important;
        align-items: stretch;
      }

      .main .stock-card {
        background: linear-gradient(180deg, #f3f6fb 0%, #e8edf5 100%) !important;
        border: 1px solid #d9e1ee;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.09);
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100%;
        position: relative;
        overflow: hidden;
        animation: cardFadeUp 0.34s ease both;
      }

      .main .stock-card::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        background: linear-gradient(90deg, #16a34a, #3b82f6);
        opacity: 0.75;
      }

      .main .icon-top-right img {
        width: 24px;
      }

      .main .stock-symbol {
        font-size: 1.22rem;
        font-weight: 700;
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .main .stock-name {
        font-size: 0.86rem;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.35em;
      }

      .main .stock-price {
        font-size: 1.72rem;
        line-height: 1.08;
        overflow-wrap: anywhere;
      }

      .main .stock-change {
        font-size: 1.05rem;
      }

      .main .stock-footer {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 8px;
        align-items: start !important;
        font-size: 0.84rem;
      }

      .main .stock-footer span {
        overflow-wrap: anywhere;
      }

      .main .analysis-btn,
      .main .port-btn {
        min-height: 38px;
        padding: 0.52rem;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 700;
        box-shadow: 0 8px 14px rgba(29, 78, 216, 0.2);
      }

      .main .analysis-btn {
        background: linear-gradient(135deg, #2f6df2, #1e40af);
      }

      .main .port-btn {
        background: linear-gradient(135deg, #06a970, #047857);
        box-shadow: 0 8px 14px rgba(4, 120, 87, 0.2);
      }

      .mobile-bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        height: 62px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: rgba(243, 244, 246, 0.96);
        border-top: 1px solid #d1d5db;
        box-shadow: 0 -6px 16px rgba(15, 23, 42, 0.1);
        border-radius: 16px 16px 0 0;
        backdrop-filter: blur(8px);
      }

      .mobile-bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-decoration: none;
        color: #6b7280;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .mobile-bottom-nav .nav-icon {
        font-size: 1.15rem;
        line-height: 1;
      }

      .mobile-bottom-nav .nav-icon-img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      .mobile-bottom-nav a.active {
        color: #2563eb;
        font-weight: 700;
      }
    }

    @media (max-width: 460px) {
      .header {
        flex-wrap: wrap;
      }

      .header-actions {
        width: 100%;
      }

      .refresh-btn {
        flex: 1;
      }

      .main > header {
        flex-direction: column;
        align-items: flex-start;
      }

      .timestamp {
        margin-left: 0;
      }

      .main .stock-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    }

    @media (max-width: 430px) {
      .main {
        padding: 0.85rem 0.7rem 0.45rem;
      }

      .main h2 {
        font-size: 1.55rem;
        margin-top: 1rem;
        margin-bottom: 0.62rem;
      }

      .main .stock-grid {
        gap: 0.65rem !important;
      }

      .main .stock-card {
        padding: 0.75rem;
        border-radius: 14px;
      }

      .main .stock-symbol {
        font-size: 1.12rem;
        font-weight: 700;
      }

      .main .stock-name {
        font-size: 0.84rem;
        min-height: 2.2em;
      }

      .main .stock-price {
        font-size: 1.58rem;
        line-height: 1.05;
      }

      .main .stock-change {
        font-size: 0.96rem;
      }

      .main .stock-footer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 6px;
        font-size: 0.82rem;
      }

      .main .analysis-btn,
      .main .port-btn {
        min-height: 32px;
        padding: 0.48rem;
        font-size: 0.76rem;
      }
    }

    @media (max-width: 360px) {
      .main .stock-card {
        padding: 0.66rem;
      }

      .main .stock-symbol {
        font-size: 1rem;
      }

      .main .stock-name {
        font-size: 0.78rem;
      }

      .main .stock-price {
        font-size: 1.42rem;
      }

      .main .analysis-btn,
      .main .port-btn {
        font-size: 0.72rem;
      }
    }

    @media (min-width: 769px) {
      .mobile-bottom-nav {
        display: none;
      }
    }
  </style>
</head>

<body>

  {% include 'sidebar.html' %}

  <div class="main">

    <div class="header">
      <div class="header-left">
        <img src="{{ url_for('static', filename='icons/financial-decline.gif') }}" alt="Stock Dashboard Icon">
        <h1>StockQ</h1>
      </div>

      <div class="header-actions">
        <button class="refresh-btn" onclick="goToDashboard()">Watchlist</button>
      </div>
    </div>

    {% block content %}
    {% endblock %}

  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="{{ url_for('automotive') }}" class="active"><span class="nav-icon">⌂</span><span>Home</span></a>
    <a href="#market-sectors"><span class="nav-icon">▦</span><span>Sectors</span></a>
    <a href="/dashboard">
      <img class="nav-icon-img" src="{{ url_for('static', filename='icons/candlestick-chart_6353948.png') }}" alt="Watchlist">
      <span>Watchlist</span>
    </a>
  </nav>

  <script>
    function goToDashboard() {
      window.location.href = "/dashboard";
    }

    (function setupAutoRefresh() {
      const minDelayMs = 20000;
      const maxDelayMs = 30000;

      function randomDelay() {
        return Math.floor(Math.random() * (maxDelayMs - minDelayMs + 1)) + minDelayMs;
      }

      function scheduleNextRefresh() {
        setTimeout(() => {
          if (document.visibilityState === "visible") {
            window.location.reload();
            return;
          }

          // If tab is hidden, postpone until next cycle to avoid unnecessary reloads.
          scheduleNextRefresh();
        }, randomDelay());
      }

      scheduleNextRefresh();
    })();
  </script>

</body>
</html>
